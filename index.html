<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine?</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a0a2e, #2d1b4e, #1a0a2e);
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      position: relative;
    }

    /* ── floating hearts background ── */
    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .floating-heart {
      position: absolute;
      bottom: -60px;
      font-size: 20px;
      animation: floatUp linear infinite;
      opacity: 0.15;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg) scale(1);   opacity: 0; }
      10%  { opacity: 0.15; }
      90%  { opacity: 0.15; }
      100% { transform: translateY(-110vh) rotate(360deg) scale(0.5); opacity: 0; }
    }

    /* ── card ── */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 50px 40px 40px;
      text-align: center;
      max-width: 520px;
      width: 90%;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: cardEntry 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardEntry {
      from { transform: translateY(60px) scale(0.9); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* ── big heart icon ── */
    .heart-icon {
      font-size: 80px;
      animation: heartbeat 1.2s ease-in-out infinite;
      display: inline-block;
      filter: drop-shadow(0 0 20px rgba(255, 70, 100, 0.5));
      margin-bottom: 10px;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15%      { transform: scale(1.15); }
      30%      { transform: scale(1); }
      45%      { transform: scale(1.1); }
      60%      { transform: scale(1); }
    }

    .title {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.2;
      text-shadow: 0 0 30px rgba(255, 100, 130, 0.4);
    }

    .subtitle {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 300;
      margin-bottom: 35px;
    }

    /* ── attempt counter ── */
    .attempt-counter {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 20px;
      min-height: 1.4em;
      transition: color 0.3s;
    }

    .attempt-counter.visible {
      color: rgba(255, 150, 170, 0.7);
    }

    /* ── buttons ── */
    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      min-height: 120px;
    }

    .btn {
      border: none;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff4b6e, #ff8fa0);
      color: #fff;
      font-size: 18px;
      padding: 16px 48px;
      box-shadow: 0 8px 30px rgba(255, 75, 110, 0.4);
    }

    .btn-yes:hover {
      box-shadow: 0 12px 40px rgba(255, 75, 110, 0.6);
      transform: translateY(-2px);
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      padding: 12px 32px;
    }

    .btn-no:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* ── teasing messages ── */
    .tease-msg {
      font-size: 0.95rem;
      color: rgba(255, 180, 200, 0.8);
      margin-top: 15px;
      min-height: 1.5em;
      font-style: italic;
      animation: fadeInMsg 0.4s ease both;
    }

    @keyframes fadeInMsg {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── celebration overlay ── */
    .celebration {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #2d1045 0%, #0d0415 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .celebration.active {
      opacity: 1;
      pointer-events: all;
    }

    .celebration h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 4rem;
      color: #fff;
      text-shadow: 0 0 40px rgba(255, 100, 130, 0.6);
      animation: celebPop 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }

    .celebration p {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 12px;
      animation: celebPop 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
    }

    .celebration .big-hearts {
      font-size: 100px;
      animation: celebPop 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }

    @keyframes celebPop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    /* ── confetti canvas ── */
    #confetti {
      position: fixed;
      inset: 0;
      z-index: 101;
      pointer-events: none;
    }

    /* ── sparkle particles on no-click ── */
    .sparkle {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 50;
      animation: sparkleOut 0.6s ease-out forwards;
    }

    @keyframes sparkleOut {
      0%   { transform: scale(1); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }

    /* responsive */
    @media (max-width: 480px) {
      .title { font-size: 2.2rem; }
      .card  { padding: 35px 25px 30px; }
      .celebration h1 { font-size: 2.8rem; }
    }
  </style>
</head>
<body>

  <!-- floating hearts background -->
  <div class="hearts-bg" id="heartsBg"></div>

  <!-- main card -->
  <div class="card" id="card">
    <div class="heart-icon">&#10084;&#65039;</div>
    <h1 class="title">Will You Be<br>My Valentine?</h1>
    <p class="subtitle">I already know the answer&hellip;</p>

    <div class="attempt-counter" id="counter"></div>

    <div class="buttons">
      <button class="btn btn-yes" id="yesBtn" onclick="sayYes()">Yes!</button>
      <button class="btn btn-no"  id="noBtn"  onclick="sayNo()">No</button>
    </div>

    <div class="tease-msg" id="teaseMsg"></div>
  </div>

  <!-- celebration screen -->
  <div class="celebration" id="celebration">
    <div class="big-hearts">&#128149;</div>
    <h1>Yay!! &#127881;</h1>
    <p>I knew you&rsquo;d say yes &hearts;</p>
  </div>

  <canvas id="confetti"></canvas>

  <script>
    // ── state ──
    let noCount = 0;
    let yesScale = 1;
    let noScale  = 1;
    const yesBtn   = document.getElementById('yesBtn');
    const noBtn    = document.getElementById('noBtn');
    const teaseMsg = document.getElementById('teaseMsg');
    const counter  = document.getElementById('counter');

    // ── teasing messages ──
    const messages = [
      "Are you sure? 🥺",
      "Think again... pretty please?",
      "That's not even an option! 💔",
      "My heart just cracked a little...",
      "You're breaking my heart! 😢",
      "I'll keep asking forever...",
      "The button is shrinking like your excuses 😏",
      "Resistance is futile 💘",
      "You really wanna say no? Really?",
      "Even my code is begging you...",
      "Come onnn, just press Yes!",
      "I promise it'll be worth it ❤️",
      "Your finger is drifting to Yes, I can feel it",
      "The universe wants you to say Yes ✨",
      "Last chance... just kidding, there's no last chance 😈",
    ];

    // ── say No ──
    function sayNo() {
      noCount++;

      // grow yes, shrink no
      yesScale += 0.35;
      noScale  = Math.max(0.2, noScale - 0.12);

      yesBtn.style.transform = `scale(${yesScale})`;
      yesBtn.style.zIndex    = 10;
      noBtn.style.transform  = `scale(${noScale})`;
      noBtn.style.opacity    = Math.max(0.3, 1 - noCount * 0.08);

      // update font size on yes so text stays readable
      yesBtn.style.fontSize = `${18 + noCount * 2}px`;
      yesBtn.style.padding  = `${16 + noCount * 3}px ${48 + noCount * 6}px`;

      // pick a message
      const msgIndex = Math.min(noCount - 1, messages.length - 1);
      teaseMsg.textContent = messages[msgIndex];
      teaseMsg.style.animation = 'none';
      void teaseMsg.offsetWidth; // reflow
      teaseMsg.style.animation = 'fadeInMsg 0.4s ease both';

      // counter
      counter.classList.add('visible');
      counter.textContent = noCount === 1
        ? `You've said no ${noCount} time... but ok`
        : `You've said no ${noCount} times... interesting`;

      // sparkle burst at click
      spawnSparkles(event);

      // after many clicks, make the no button run away randomly
      if (noCount >= 5) {
        const dx = (Math.random() - 0.5) * 120;
        const dy = (Math.random() - 0.5) * 60;
        noBtn.style.position = 'relative';
        noBtn.style.left = `${dx}px`;
        noBtn.style.top  = `${dy}px`;
      }
    }

    // ── say Yes ──
    function sayYes() {
      document.getElementById('card').style.transition = 'opacity 0.5s, transform 0.5s';
      document.getElementById('card').style.opacity = '0';
      document.getElementById('card').style.transform = 'scale(0.9)';

      setTimeout(() => {
        document.getElementById('celebration').classList.add('active');
        launchConfetti();
      }, 400);
    }

    // ── sparkle particles on no-click ──
    function spawnSparkles(e) {
      const colors = ['#ff4b6e', '#ff8fa0', '#ffccd5', '#fff', '#ff6b8a'];
      for (let i = 0; i < 12; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = `${e.clientX}px`;
        s.style.top  = `${e.clientY}px`;
        s.style.background = colors[Math.floor(Math.random() * colors.length)];
        const angle = (Math.PI * 2 / 12) * i;
        const dist  = 30 + Math.random() * 40;
        s.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 600);
      }
    }

    // ── floating background hearts ──
    (function initHearts() {
      const container = document.getElementById('heartsBg');
      const hearts = ['❤', '💕', '💗', '♥', '💘', '💖'];
      for (let i = 0; i < 25; i++) {
        const h = document.createElement('div');
        h.className = 'floating-heart';
        h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        h.style.left = `${Math.random() * 100}%`;
        h.style.fontSize = `${14 + Math.random() * 24}px`;
        h.style.animationDuration = `${8 + Math.random() * 12}s`;
        h.style.animationDelay = `${Math.random() * 10}s`;
        container.appendChild(h);
      }
    })();

    // ── confetti ──
    function launchConfetti() {
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ['#ff4b6e','#ff8fa0','#ffccd5','#ff6b8a','#e84393',
                       '#fd79a8','#fab1a0','#ffeaa7','#fff','#dfe6e9'];

      for (let i = 0; i < 200; i++) {
        pieces.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 200,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 18,
          vy: -Math.random() * 20 - 5,
          w: 6 + Math.random() * 6,
          h: 4 + Math.random() * 10,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360,
          rv: (Math.random() - 0.5) * 12,
          gravity: 0.25 + Math.random() * 0.15,
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        for (const p of pieces) {
          p.x += p.vx;
          p.vy += p.gravity;
          p.y += p.vy;
          p.rot += p.rv;
          if (p.y < canvas.height + 50) alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        if (alive) requestAnimationFrame(draw);
      }
      draw();
    }

    // resize handler for confetti canvas
    window.addEventListener('resize', () => {
      const c = document.getElementById('confetti');
      c.width  = window.innerWidth;
      c.height = window.innerHeight;
    });
  </script>
</body>
</html>
